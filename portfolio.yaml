# Catalyst Desk — Portfolio
#
# Each entry needs:
#   symbol     : NSE trading symbol (used by yfinance with .NS suffix)
#   bse_code   : BSE numeric scrip code (used by BSE announcements API)
#   name       : Full company name (used to match news + SEBI press)
#   isin       : Optional, useful for cross-referencing
#   sector     : Optional, used for grouping/filtering in the dashboard
#   notes      : Optional, free-form commentary you'd like to remember
#   skip_catalysts : Optional bool. If true, fetch price-only and skip the
#                    LLM correlation step. Use for ETFs, SGBs, and other
#                    non-equity instruments where "catalyst" doesn't apply.

stocks:
